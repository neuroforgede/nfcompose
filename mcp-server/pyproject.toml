[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfcompose-mcp-server"
version = "0.1.0"
description = "Read-only REST MCP server for NF Compose"
requires-python = ">=3.11"
dependencies = ["compose-client>=2.3.7,<3", "mcp>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nfcompose-mcp = "nfcompose_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
